<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayyid al-Istighfar — Arabic Recitation</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
    text-align: center;
    background: #f7f7f7;
  }
  textarea {
    width: 100%;
    height: 260px;
    font-size: 24px;
    line-height: 2;
    direction: rtl;
    box-sizing: border-box;
  }
  button, input, select {
    font-size: 18px;
    padding: 10px;
    margin: 6px;
  }
  #status {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>
<body><h1>سيد الاستغفار</h1>
<p>Continuous Arabic Mubeen voice recitation</p><textarea id="prayer">اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي، وأبوء لك بذنبي، فاغفر لي، فإنه لا يغفر الذنوب إلا أنت.</textarea><br><label>
  Number of recitations:
  <input id="count" type="number" min="1" value="100">
</label><br><label>
  Arabic voice:
  <select id="voice"></select>
</label><br><button onclick="startRecitation()">▶ Start</button>
<button onclick="stopRecitation()">■ Stop</button>

<div id="status">Ready</div><script>
let voices = [];
let stopped = false;
let currentRecitation = 0;

function loadVoices() {
  voices = speechSynthesis.getVoices();

  const select = document.getElementById("voice");
  select.innerHTML = "";

  const arabicVoices = voices.filter(v =>
    v.lang.toLowerCase().startsWith("ar")
  );

  const available = arabicVoices.length ? arabicVoices : voices;

  available.forEach((voice, index) => {
    const option = document.createElement("option");
    option.value = voices.indexOf(voice);
    option.textContent = `${voice.name} (${voice.lang})`;
    select.appendChild(option);
  });
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speakOnce(text, voice, rate = 0.78) {
  return new Promise(resolve => {
    if (stopped) {
      resolve();
      return;
    }

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.voice = voice;
    utterance.lang = "ar";
    utterance.rate = rate;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;

    utterance.onend = resolve;
    utterance.onerror = resolve;

    speechSynthesis.speak(utterance);
  });
}

async function startRecitation() {
  stopRecitation();
  stopped = false;
  currentRecitation = 0;

  const text = document.getElementById("prayer").value.trim();
  const count = Number(document.getElementById("count").value);

  if (!text || !count || count < 1) {
    document.getElementById("status").textContent =
      "Please enter valid text and a positive count.";
    return;
  }

  const selectedIndex = Number(document.getElementById("voice").value);
  const voice = voices[selectedIndex];

  if (!voice) {
    document.getElementById("status").textContent =
      "No speech voice is available on this device.";
    return;
  }

  for (let i = 0; i < count; i++) {
    if (stopped) break;

    currentRecitation = i + 1;
    document.getElementById("status").textContent =
      `Recitation ${currentRecitation} of ${count}`;

    await speakOnce(text, voice);
  }

  if (!stopped) {
    document.getElementById("status").textContent =
      `Completed ${currentRecitation} recitations.`;
  }
}

function stopRecitation() {
  stopped = true;
  speechSynthesis.cancel();
  document.getElementById("status").textContent = "Stopped";
}
</script></body>
</html>
